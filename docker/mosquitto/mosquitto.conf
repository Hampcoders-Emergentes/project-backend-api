# ============================================================================
# Mosquitto — broker SOLO para desarrollo local
# ============================================================================
# Mosquitto 2.x rechaza conexiones remotas si no se declara un listener
# explícito y allow_anonymous. Este archivo habilita ambos para que la API
# (contenedor `api`) pueda conectarse a `mqtt:1883`.
#
# NO usar esta configuración en producción: sin autenticación ni TLS.
# Para producción: `allow_anonymous false`, `password_file`, `listener 8883`
# con `cafile`/`certfile`/`keyfile`.
# ============================================================================

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
